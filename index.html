<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iPhone: full-screen app with its own icon when added to the Home Screen. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="After Rain" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>After Rain</title>
    <meta name="theme-color" content="#fbf6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a33" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved day/night choice before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('rain.theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          var c = t === 'dark' ? '#1b1a33' : '#fbf6f1'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c) })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
